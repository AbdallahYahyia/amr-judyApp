name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'dist/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The runner image already ships the Android SDK; just make sure licenses are accepted.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: amr-judy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK into repo (dist/amr-judy.apk)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/amr-judy.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/amr-judy.apk
          git diff --cached --quiet || git commit -m "Build APK [skip ci]"
          git push
